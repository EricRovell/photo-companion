name: setup
description: 'Shared action to install pnpm and node'

runs:
  using: 'composite'
  steps:

    - uses: pnpm/action-setup@v6
      name: Install pnpm

    - name: Node Setup
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install
